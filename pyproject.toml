[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matched-endpoint-authz"
version = "0.1.0"
description = "Standalone extraction of the SP27 SoftwareClient authorization ledger (research reference for a disclosed CWE-863 defect)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Dijiang Huang" }]

[tool.setuptools]
py-modules = ["matched_endpoint_authz"]
